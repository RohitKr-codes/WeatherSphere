<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WeatherSphere | Real Time Weather App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./style.css">

    <script src="./script.js" defer></script>

</head>

<body>

    <!-- LOGOUT TOP RIGHT -->

    <button class="logout-btn" id="logoutBtn">
        Logout
    </button>

    <div class="overlay"></div>

    <div class="card">

        <div class="logo-section">

            <h1 class="app-title">
                WeatherSphere
            </h1>

            <p class="tagline">
                Real-Time Weather Intelligence
            </p>

        </div>

        <div class="search">

            <input type="text"
                class="search-bar"
                placeholder="Search any city in the world...">

            <button class="search-btn">

                <svg stroke="currentColor"
                    fill="currentColor"
                    stroke-width="0"
                    viewBox="0 0 24 24"
                    height="1.5em"
                    width="1.5em"
                    xmlns="http://www.w3.org/2000/svg">

                    <path
                        d="M10,18c1.846,0,3.543-0.635,4.897-1.688l4.396,4.396l1.414-1.414l-4.396-4.396C17.365,13.543,18,11.846,18,10c0-4.411-3.589-8-8-8s-8,3.589-8,8S5.589,18,10,18z M10,4c3.309,0,6,2.691,6,6s-2.691,6-6,6s-6-2.691-6-6S6.691,4,10,4z">
                    </path>

                </svg>

            </button>

        </div>

        <div class="weather loading">

            <div class="weather-header">

                <div>

                    <h2 class="city">
                        Weather in Varanasi
                    </h2>

                    <div class="description">
                        Cloudy
                    </div>

                </div>

                <img src="https://openweathermap.org/img/wn/04n.png"
                    alt="Weather Icon"
                    class="icon" />

            </div>

            <h1 class="temp">
                28°C
            </h1>

            <div class="details">

                <div class="detail-box">

                    <h4>Humidity</h4>

                    <p class="humidity">
                        60%
                    </p>

                </div>

                <div class="detail-box">

                    <h4>Wind Speed</h4>

                    <p class="wind">
                        6.2 km/h
                    </p>

                </div>

            </div>

        </div>

    </div>

<script>

    // AUTH CHECK

    const loggedInUser = localStorage.getItem("loggedInUser");

    if (!loggedInUser) {

        window.location.href = "login.html";

    }

    // LOGOUT

    document.getElementById("logoutBtn")
        .addEventListener("click", () => {

            localStorage.removeItem("loggedInUser");

            alert("Logged Out Successfully");

            window.location.href = "login.html";

        });

</script>

</body>

</html>
